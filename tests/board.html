<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Board checks — isolated data</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../board.css" />
</head>
<body>
  <p>Running board checks with an in-memory Firestore substitute…</p>
  <script type="module">
    // No Firebase SDK, credentials or network writes are used by this test page.
    import { createBoardController, BOARD_SPACES, playerBoardPosition, boardGridPosition, cardMovementRoute, CHANCE_CARDS, COMMUNITY_CHEST_CARDS } from "../board.js";
    const results = [];
    const assert = (condition, message) => { if (!condition) throw new Error(message); results.push(message); };
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    // Opt-in deterministic scheduling for headless --virtual-time-budget runs.
    // Interactive runs keep the browser's real animation frames and transitions.
    if (new URLSearchParams(location.search).has("headless")) {
      window.requestAnimationFrame = callback => setTimeout(() => callback(performance.now()), 16);
    }
    try {
      const markup = await (await fetch("../index.html")).text();
      const parsed = new DOMParser().parseFromString(markup, "text/html");
      parsed.querySelectorAll("script").forEach(script => script.remove());
      document.body.replaceChildren(...parsed.body.childNodes);
      if (new URLSearchParams(location.search).has("headless")) {
        const style = document.createElement("style");
        style.textContent = ".board-player-token, .board-world { transition: none !important; }";
        document.head.append(style);
      }
      const report = document.createElement("pre");
      report.id = "boardTestResults";
      report.style.cssText = "white-space:pre-wrap;padding:16px;background:#fff;position:relative;z-index:10";
      document.body.prepend(report);
      const source = (await (await fetch("../app.js")).text()).replace(/^import[\s\S]*?;\s*/gm, "");
      let storedGame = {}, storedPlayer = {}, writes = 0, failCommit = false, retryGame = null;
      let confirmed = null, allowConfirm = false;
      const storedTransactions = new Map();
      const missingPlayers = new Set();
      const sdk = {
        initializeApp: () => ({}), getAuth: () => ({}), getFirestore: () => ({}),
        onAuthStateChanged: () => {}, signInAnonymously: async () => {},
        doc: (...args) => args[0]?.kind === "collection"
          ? { kind: "transaction", id: args[1] || `transaction-${storedTransactions.size}` }
          : { kind: args.length === 3 ? "game" : "player", id: args[args.length - 1] },
        collection: (...args) => ({ kind: "collection", path: args.slice(1) }),
        getDoc: () => {}, getDocs: () => {}, setDoc: () => {}, addDoc: () => {},
        onSnapshot: () => () => {}, query: () => ({}), orderBy: () => ({}), limit: () => ({}),
        serverTimestamp: () => 0, writeBatch: () => ({}),
        runTransaction: async (_db, callback) => {
          if (failCommit) throw new Error("Simulated network failure");
          const queued = [];
          const result = await callback({
            get: async ref => ({ exists: () => ref.kind === "game" || !missingPlayers.has(ref.id), data: () => ref.kind === "game" ? storedGame : storedPlayer }),
            update: (ref, patch) => queued.push([ref, patch]),
            set: (ref, data) => queued.push([ref, data])
          });
          if (retryGame) {
            storedGame = { ...storedGame, ...retryGame };
            retryGame = null;
            return sdk.runTransaction(_db, callback);
          }
          for (const [ref, patch] of queued) {
            if (ref.kind === "game") storedGame = { ...storedGame, ...patch };
            else if (ref.kind === "player") storedPlayer = { ...storedPlayer, ...patch };
            else if (ref.kind === "transaction") storedTransactions.set(ref.id, patch);
            writes++;
          }
          return result;
        },
        firebaseConfig: {}, createBoardController, BOARD_SPACES, playerBoardPosition, cardMovementRoute, CHANCE_CARDS, COMMUNITY_CHEST_CARDS,
        confirm: message => { confirmed = message; return allowConfirm; },
        localStorage: { getItem: () => null, setItem: () => {}, removeItem: () => {} }
      };
      // Execute the actual app against the substitute, not a copy of its movement logic.
      const test = new Function(...Object.keys(sdk), `${source}\nreturn {
        presets: PROPERTY_PRESETS, board: boardController, move: movePlayerOnBoard, roll: rollDice, endTurn,
        setState(state) { gameId = state.gameId; currentPlayerId = state.currentPlayerId; gameData = state.gameData; players = state.players; properties = state.properties; language = state.language || 'en'; boardController.sync(); },
        state() { return { players, gameData, diceRollInProgress, boardSessionGeneration }; },
        setLanguage, openDiceDialog, translations, t, setDiceLabels,
        openMoneyDialog, closeMoneyDialog, openPropertySaleDialog, closePropertySaleDialog,
        openPrivateMessages, renderProperties, renderHeldJailCards, useJailReleaseCard,
        observeCardDraws, displayCardDraw,
        resetCardEvents() { seenCardDraws = new Set(); cardSnapshotInitialized = false; },
        setMessages(messages) { privateMessages = messages; boardController.sync(); }
      };`)(...Object.values(sdk));
      const chanceDraw = test.board.drawChanceCard, communityDraw = test.board.drawCommunityChestCard;
      // Existing general movement tests deliberately draw an ordinary card.
      test.board.drawChanceCard = holders => chanceDraw(holders, 7);
      test.board.drawCommunityChestCard = holders => communityDraw(holders, 1);
      const state = {
        gameId: "BOARDTEST", currentPlayerId: "p0", language: "en",
        gameData: { currentTurnPlayerId: "p0", turnNumber: 1, freeParkingPot: 350 },
        players: ["car", "hat", "ship", "shoe", "dog", "cat", "iron", "thimble"].map((icon, i) => ({ id: `p${i}`, name: `Player ${i + 1}`, icon, color: ["#d64545", "#2f6fd6", "#2f8b57", "#d5a62f", "#29313a", "#cc5f93", "#218b8f", "#d66d2f"][i], balance: 1500 })),
        properties: [{ id: "owned-brown", presetId: "Korkeavuorenkatu", ownerId: "p0", houses: 4, mortgaged: false }]
      };
      test.setState(state);
      const boardSource = await (await fetch("../board.js")).text();
      const boardText = new Function(`${boardSource.replace(/\bexport\s+/g, "")}\nreturn { LABELS, CHANCE_CARDS, COMMUNITY_CHEST_CARDS };`)();
      const keys = Object.keys(test.translations.en).sort();
      assert(JSON.stringify(keys) === JSON.stringify(Object.keys(test.translations.fi).sort()), "Application FI/EN dictionaries have identical keys");
      assert(JSON.stringify(Object.keys(boardText.LABELS.en).sort()) === JSON.stringify(Object.keys(boardText.LABELS.fi).sort()), "Board FI/EN dictionaries have identical keys");
      const referencedKeys = [...source.matchAll(/\bt\(["']([^"']+)["']\)/g)].map(match => match[1]);
      assert(referencedKeys.every(key => test.translations.en[key] && test.translations.fi[key]), "Every literal application translation reference exists in both languages");
      assert(keys.every(key => {
        const placeholders = text => JSON.stringify((text.match(/\{\w+\}/g) || []).sort());
        return placeholders(test.translations.en[key]) === placeholders(test.translations.fi[key]);
      }), "FI/EN interpolation placeholders match");
      assert([...boardText.CHANCE_CARDS, ...boardText.COMMUNITY_CHEST_CARDS].every(card => card.text.en && card.text.fi), "All informational cards have FI and EN text");
      assert(BOARD_SPACES.length === 40 && BOARD_SPACES.every((space, i) => space.index === i), "40 stable board indices");
      assert(new Set(BOARD_SPACES.map(space => JSON.stringify(boardGridPosition(space.index)))).size === 40, "40 unique grid positions");
      assert(BOARD_SPACES.filter(space => space.propertyId).every(space => test.presets.some(preset => preset.id === space.propertyId)), "Every board property references an existing preset");
      assert(BOARD_SPACES.filter(space => space.propertyId).length === test.presets.length, "All 28 Helsinki presets appear on the board");
      assert(playerBoardPosition({}) === 0 && playerBoardPosition({ position: -1 }) === 0 && playerBoardPosition({ position: 39 }) === 39, "Legacy and invalid positions are safely normalized");
      test.board.openBoardDialog();
      await wait(100);
      const viewport = document.getElementById("boardViewport"), world = document.getElementById("boardWorld");
      const boardDialog = document.getElementById("boardDialog"), follow = document.getElementById("boardFollow");
      const boardFitsViewport = () => {
        const bounds = world.getBoundingClientRect(), view = viewport.getBoundingClientRect();
        return bounds.width > 0 && bounds.height > 0 && bounds.left >= view.left - 1 && bounds.top >= view.top - 1
          && bounds.right <= view.right + 1 && bounds.bottom <= view.bottom + 1;
      };
      assert(boardFitsViewport(), "Initial board open fits the full board inside the viewport");
      assert(!follow.checked, "Follow my token is unchecked by default");
      assert([...document.querySelectorAll('.board-zoom-controls button')].every(button => button.getClientRects().length === 0), "Zoom minus, percentage and plus controls are hidden from view");
      assert(document.getElementById("boardBalancePlayer").textContent === "Player 1" && document.getElementById("boardBalanceValue").textContent === "1,500", "Board toolbar shows the selected player's name and current balance");
      state.players[0].balance = 1825;
      test.setState(state);
      assert(document.getElementById("boardBalanceValue").textContent === "1,825", "Board balance updates through the existing live-state synchronization");
      state.players[1].balance = 300;
      state.currentPlayerId = "p1";
      test.setState(state);
      assert(document.getElementById("boardBalancePlayer").textContent === "Player 2" && document.getElementById("boardBalanceValue").textContent === "300", "Board balance follows the selected player rather than the active turn player");
      state.currentPlayerId = "p0"; state.players[0].balance = 1500; state.players[1].balance = 1500;
      test.setState(state);
      const propertyCamera = world.getAttribute("style"), propertyWrites = writes;
      document.getElementById("boardPropertiesBtn").click();
      await wait(30);
      assert(document.getElementById("propertyDialog").open && boardDialog.open && document.getElementById("propertyList").textContent.includes("Korkeavuori Street"), "Board Properties shortcut opens the existing buying/auction/owned property view over the board");
      document.getElementById("closePropertyDialog").click();
      await wait(30);
      assert(boardDialog.open && world.getAttribute("style") === propertyCamera && writes === propertyWrites, "Closing Properties preserves board camera and performs no Firebase writes");
      for (const locale of ["fi", "en"]) {
        test.setLanguage(locale);
        assert(document.getElementById("boardPropertiesBtn").textContent === test.t("properties") && document.querySelector('.board-player-balance [data-i18n="yourBalance"]').textContent === test.t("yourBalance"), `${locale}: board properties and balance labels are translated`);
      }
      const balanceBounds = document.querySelector('.board-player-balance').getBoundingClientRect();
      const toolbarBounds = boardDialog.getBoundingClientRect();
      assert(balanceBounds.left >= toolbarBounds.left && balanceBounds.right <= toolbarBounds.right, "Board balance fits inside the dialog on desktop and narrow layouts");
      const initialZoom = Number(world.style.getPropertyValue("--zoom"));
      document.getElementById("boardZoomIn").click();
      assert(Number(world.style.getPropertyValue("--zoom")) > initialZoom, "Board is zoomed in before reopening");
      follow.click();
      assert(follow.checked, "User can manually enable token following");
      document.getElementById("closeBoardBtn").click();
      await wait(30);
      test.board.openBoardDialog();
      await wait(100);
      assert(boardFitsViewport(), "Reopening a zoomed board fits the full board again");
      assert(follow.checked, "Reopening preserves manually enabled follow instead of resetting its default");
      follow.click(); // Keep the original movement/camera checks independent of following.
      assert(document.querySelectorAll(".board-space").length === 40, "Renderer creates 40 spaces once");
      assert(document.querySelectorAll(".board-player-token").length === 8, "All eight tokens visible at GO");
      assert(new Set([...document.querySelectorAll(".board-player-token")].map(token => token.style.transform)).size === 8, "Shared-space tokens have distinct offsets");
      state.players.forEach(player => { player.position = 11; });
      test.setState(state);
      await wait(170);
      const sideName = document.querySelector("#board-space-11 .board-space-name").getBoundingClientRect();
      const sideStrip = document.querySelector("#board-space-11 .board-color-strip").getBoundingClientRect();
      assert([...document.querySelectorAll(".board-player-token")].every(token => token.getBoundingClientRect().top >= sideName.bottom && token.getBoundingClientRect().top >= sideStrip.bottom), "Eight side-space tokens do not cover the name or building strip");
      state.players.forEach(player => { delete player.position; });
      test.setState(state);
      await wait(170);
      const firstSpace = document.getElementById("board-space-1");
      assert(firstSpace.querySelectorAll(".board-building").length === 4, "Four green houses rendered");
      const token = document.querySelector(".board-player-token");
      state.properties[0].houses = 5; state.properties[0].mortgaged = true;
      state.gameData.freeParkingPot = 720;
      test.setState(state);
      assert(firstSpace.querySelectorAll(".board-hotel").length === 1 && firstSpace.querySelectorAll(".board-building").length === 1, "Five houses become one red hotel");
      assert(firstSpace.classList.contains("is-mortgaged") && !firstSpace.querySelector(".board-mortgage").hidden, "Mortgage visual updates");
      assert(!firstSpace.querySelector(".board-owner").hidden && firstSpace.querySelector(".board-owner").style.backgroundColor === "rgb(214, 69, 69)", "Owner color is independent of group strip");
      assert(document.getElementById("boardPotValue").textContent === "720", "Shared pot updates");
      assert(document.getElementById("boardClaimPotValue").textContent === "720" && !document.getElementById("boardClaimPotBtn").disabled, "Toolbar claim amount updates live to 720 and enables claiming");
      state.gameData.freeParkingPot = 0;
      test.setState(state);
      assert(document.getElementById("boardClaimPotValue").textContent === "0" && document.getElementById("boardClaimPotBtn").disabled, "Zero pot updates the toolbar amount and disables claiming");
      state.gameData.freeParkingPot = 720;
      test.setState(state);
      assert(document.querySelector(".board-player-token") === token && document.getElementById("board-space-1") === firstSpace, "Updates preserve token and space DOM nodes");
      for (let count = 0; count < 4; count++) {
        state.properties[0].houses = count;
        test.setState(state);
        assert(firstSpace.querySelectorAll(".board-building").length === count, `${count} houses render correctly`);
      }
      state.properties[0].houses = 5;
      test.setState(state);
      test.setLanguage("fi");
      assert(document.getElementById("boardTitle").textContent === "Pelilauta", "Finnish board labels supported");
      for (const locale of ["en", "fi"]) {
        test.setLanguage(locale);
        const text = test.translations[locale], boardLabels = boardText.LABELS[locale];
        assert([...document.querySelectorAll("[data-i18n]")].every(element => text[element.dataset.i18n] && element.textContent === text[element.dataset.i18n]), `${locale}: every static app label is translated`);
        assert([...document.querySelectorAll("[data-i18n-placeholder]")].every(element => element.placeholder === text[element.dataset.i18nPlaceholder]), `${locale}: input placeholders are translated`);
        assert([...document.querySelectorAll("[data-i18n-aria-label]")].every(element => element.getAttribute("aria-label") === text[element.dataset.i18nAriaLabel]), `${locale}: accessible app labels are translated`);
        assert([...document.querySelectorAll("[data-board-label]")].every(element => boardLabels[element.dataset.boardLabel] && element.textContent === boardLabels[element.dataset.boardLabel]), `${locale}: every static board label is translated`);
        assert([...document.querySelectorAll("[data-board-aria]")].every(element => element.getAttribute("aria-label") === boardLabels[element.dataset.boardAria]), `${locale}: accessible board labels are translated`);
        assert(BOARD_SPACES.every(space => document.querySelector(`#board-space-${space.index} .board-space-name`).textContent === (space.propertyId ? test.presets.find(preset => preset.id === space.propertyId).name[locale] : space.name[locale])), `${locale}: all 40 space names follow the selected language`);
        assert(document.querySelector('#playerColorChoices input[value="#d64545"]').getAttribute("aria-label") === text.color_red, `${locale}: color names are translated`);
        test.setDiceLabels(7, "diceDoubleAgain");
        test.setLanguage(locale === "en" ? "fi" : "en");
        test.setLanguage(locale);
        assert(document.getElementById("diceTotal").textContent === `${text.diceTotal}: 7` && document.getElementById("diceResult").textContent === text.diceDoubleAgain, `${locale}: existing dice results refresh without rerolling`);
        test.board.finishMovement("p0");
        test.setLanguage(locale === "en" ? "fi" : "en");
        test.setLanguage(locale);
        assert(document.getElementById("boardMovementStatus").textContent.includes(boardLabels.landed), `${locale}: landed status refreshes its language`);
        test.board.setMovementError(test.t("boardStaleRevision"), "boardStaleRevision");
        test.setLanguage(locale === "en" ? "fi" : "en");
        test.setLanguage(locale);
        assert(document.getElementById("boardMovementStatus").textContent === text.boardStaleRevision, `${locale}: keyed board error refreshes its language`);
        test.board.showCard({ type: "chance", ...boardText.CHANCE_CARDS[0] });
        test.setLanguage(locale === "en" ? "fi" : "en");
        test.setLanguage(locale);
        assert(document.getElementById("boardCardText").textContent === boardText.CHANCE_CARDS[0].text[locale] && document.getElementById("boardCardTitle").textContent === boardLabels.chance, `${locale}: open card popup refreshes its language`);
        document.getElementById("closeBoardCard").click();
        await wait(30);
      }
      test.openMoneyDialog("player");
      document.getElementById("recipientSelect").value = "p2";
      document.getElementById("moneyAmount").value = "125";
      document.getElementById("moneyReason").value = "User note";
      test.setLanguage("fi");
      assert(document.getElementById("moneyDialogTitle").textContent === test.t("payAnotherPlayer") && document.getElementById("recipientSelect").value === "p2" && document.getElementById("moneyAmount").value === "125" && document.getElementById("moneyReason").value === "User note", "Money dialog translates without losing recipient, amount or note");
      test.closeMoneyDialog();
      test.openPropertySaleDialog("owned-brown");
      document.getElementById("propertySaleAmount").value = "75";
      test.setLanguage("en");
      assert(document.getElementById("propertySaleTitle").textContent.includes("Korkeavuori Street") && document.getElementById("propertySaleAmount").value === "75", "Sale heading translates while preserving its property and draft amount");
      test.closePropertySaleDialog();
      test.setMessages([{ id: "test-message", senderId: "p0", recipientId: "p1", text: "Original user message" }]);
      test.openPrivateMessages();
      document.getElementById("privateMessageText").value = "Unsent draft";
      test.setLanguage("fi");
      assert(document.getElementById("privateMessageList").textContent.includes(test.t("you")) && document.getElementById("privateMessageList").textContent.includes("Original user message") && document.getElementById("privateMessageText").value === "Unsent draft", "Message UI translates but user content and drafts are preserved");
      document.getElementById("closePrivateMessages").click();
      test.setLanguage("en");
      const claimMenu = document.getElementById("boardClaimMenu"), payMenu = document.getElementById("boardPayMenu");
      const openMenu = async menu => {
        if (!menu.open) menu.querySelector("summary").click();
        await wait(30); // Let the native, queued details toggle event run.
      };
      const menusClosed = () => !claimMenu.open && !payMenu.open;
      await openMenu(claimMenu);
      assert(claimMenu.open && !payMenu.open, "Native Claim summary opens its details menu");
      await openMenu(payMenu);
      assert(payMenu.open && !claimMenu.open, "Native Pay toggle closes Claim");
      await openMenu(claimMenu);
      assert(claimMenu.open && !payMenu.open, "Native Claim toggle closes Pay");
      document.getElementById("boardTitle").dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, pointerType: "mouse" }));
      assert(menusClosed() && boardDialog.open, "Outside pointer closes board action menus without closing the board");
      for (const menu of [claimMenu, payMenu]) {
        await openMenu(menu);
        menu.querySelector("summary").dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
        assert(menusClosed() && boardDialog.open && document.activeElement === menu.querySelector("summary"), `${menu.id}: Escape closes the menu, preserves the board and focuses its summary`);
      }
      const actionButton = action => document.querySelector(`[data-board-action="${action}"]`);
      const toolbarWrites = writes;
      for (const [action, titleKey] of [["bank-receive", "receiveFromBank"], ["player", "payAnotherPlayer"], ["bank-pay", "payBank"], ["free-parking-pay", "payFreeParking"]]) {
        await openMenu(action === "bank-receive" ? claimMenu : payMenu);
        const camera = world.style.cssText;
        actionButton(action).click();
        await wait(30);
        assert(document.getElementById("moneyDialog").open && document.getElementById("moneyDialogTitle").textContent === test.t(titleKey), `${action}: toolbar opens the existing money dialog with the correct title`);
        assert(document.getElementById("recipientWrap").classList.contains("hidden") === (action !== "player"), `${action}: recipient selection is visible only for player payments`);
        assert(menusClosed() && boardDialog.open, `${action}: selection closes menus and keeps the board underneath`);
        document.getElementById("closeMoneyDialog").click();
        await wait(30);
        assert(!document.getElementById("moneyDialog").open && boardDialog.open && world.style.cssText === camera, `${action}: closing money dialog preserves the board camera`);
      }
      test.setMessages([
        { id: "toolbar-in-1", senderId: "p1", recipientId: "p0", text: "Unread one" },
        { id: "toolbar-in-2", senderId: "p2", recipientId: "p0", text: "Unread two" },
        { id: "toolbar-out", senderId: "p0", recipientId: "p1", text: "Outgoing" }
      ]);
      const badge = document.getElementById("boardMessageBadge"), messageCamera = world.style.cssText;
      assert(badge.textContent === "2" && !badge.classList.contains("hidden"), "Board unread badge counts incoming messages, not outgoing ones");
      await openMenu(payMenu);
      actionButton("messages").click();
      await wait(30);
      assert(document.getElementById("privateMessagesDialog").open && boardDialog.open && menusClosed(), "Messages toolbar opens the existing dialog and closes menus while preserving the board");
      // The storage stub intentionally discards read IDs; do not require badge clearing.
      document.getElementById("closePrivateMessages").click();
      await wait(30);
      assert(!document.getElementById("privateMessagesDialog").open && boardDialog.open && world.style.cssText === messageCamera, "Closing messages preserves the board camera");
      test.setMessages([]);
      assert(writes === toolbarWrites, "Opening and closing toolbar banking/message dialogs performs no writes");

      const savedGame = { ...state.gameData }, savedPlayers = state.players.map(player => ({ ...player }));
      const savedStoredGame = storedGame, savedStoredPlayer = storedPlayer;
      try {
        storedGame = { ...savedGame };
        storedPlayer = { ...state.players[0] };
        const beforeEndTurn = writes, turnCamera = world.style.cssText;
        await openMenu(claimMenu);
        actionButton("end-turn").click();
        await wait(30);
        assert(storedGame.currentTurnPlayerId === "p1" && writes === beforeEndTurn + 1, "Toolbar End turn advances to p1 with exactly one game write");
        assert(boardDialog.open && menusClosed() && world.style.cssText === turnCamera, "Toolbar End turn closes menus and preserves the board camera");
        state.gameData = { ...savedGame }; storedGame = { ...savedGame };
        test.setState(state); // Restore p0's turn before testing the existing pot transaction.
        const beforeClaim = writes, claimCamera = world.style.cssText, beforeTransactions = storedTransactions.size;
        await openMenu(claimMenu);
        actionButton("claim-pot").click();
        await wait(30);
        assert(confirmed === test.t("claimFreeParkingConfirm").replace("{amount}", "720") && writes === beforeClaim && storedGame.freeParkingPot === 720 && storedPlayer.balance === 1500, "Cancelling toolbar pot confirmation performs no writes or money changes");
        assert(boardDialog.open && menusClosed() && world.style.cssText === claimCamera, "Cancelled pot claim closes menus and preserves the board camera");
        allowConfirm = true;
        await openMenu(claimMenu);
        actionButton("claim-pot").click();
        await wait(30);
        assert(writes === beforeClaim + 3 && storedGame.freeParkingPot === 0 && storedPlayer.balance === 2220, "Confirmed toolbar pot claim writes game, player and transaction once, paying 720");
        const payout = [...storedTransactions.values()].at(-1);
        assert(storedTransactions.size === beforeTransactions + 1 && payout.type === "free-parking-claim" && payout.fromId === "free-parking" && payout.toId === "p0" && payout.amount === 720, "Pot claim stores a separate payout transaction without overwriting player data");
        // Simulate the subscribed snapshots explicitly; the isolated SDK has no listeners.
        state.gameData = { ...storedGame }; state.players[0] = { ...storedPlayer }; test.setState(state);
        assert(document.getElementById("boardClaimPotValue").textContent === "0" && actionButton("claim-pot").disabled, "Committed zero-pot snapshot disables the toolbar claim action");
        assert(boardDialog.open && menusClosed() && world.style.cssText === claimCamera, "Confirmed pot claim preserves the board camera");
      } finally {
        allowConfirm = false; confirmed = null;
        state.gameData = savedGame; state.players = savedPlayers;
        storedGame = savedStoredGame; storedPlayer = savedStoredPlayer;
        storedTransactions.clear();
        test.setState(state); // Original movement checks still expect p0, balance 1500 and pot 720.
      }
      const oldZoom = world.style.getPropertyValue("--zoom");
      viewport.dispatchEvent(new WheelEvent("wheel", { deltaY: -200, bubbles: true, cancelable: true }));
      assert(world.style.getPropertyValue("--zoom") === oldZoom, "Normal wheel does not zoom");
      viewport.dispatchEvent(new WheelEvent("wheel", { deltaY: -200, ctrlKey: true, bubbles: true, cancelable: true, clientX: 300, clientY: 300 }));
      assert(Number(world.style.getPropertyValue("--zoom")) > Number(oldZoom), "Ctrl-wheel zooms the board");
      for (let i = 0; i < 30; i++) document.getElementById("boardZoomIn").click();
      assert(document.getElementById("boardZoomReset").textContent === "300%", "Zoom has an upper bound");
      for (let i = 0; i < 60; i++) document.getElementById("boardZoomOut").click();
      assert(document.getElementById("boardZoomReset").textContent === "55%", "Zoom has a lower bound");
      document.getElementById("boardFit").click();
      const bounds = world.getBoundingClientRect(), viewBounds = viewport.getBoundingClientRect();
      assert(bounds.width <= viewBounds.width + 1 && bounds.height <= viewBounds.height + 1, "Full-board fit works at current viewport size");
      for (let i = 0; i < 20; i++) document.getElementById("boardZoomIn").click();
      document.getElementById("boardCenterMe").click();
      const centeredToken = token.getBoundingClientRect();

        assert(!cardDialog.open, "Observer initial snapshot establishes a baseline without showing old draws");
        test.observeCardDraws([chainEvent, remoteEvent]);
        assert(cardDialog.open && document.getElementById("boardCardPlayer").textContent === test.t("cardDrawnBy").replace("{name}", "Remote drawer") && document.getElementById("boardCardText").textContent === cardById("chance", "chance_08").text.en, "Observer displays a new other-player draw with the shared drawer name");
        test.observeCardDraws([chainEvent, remoteEvent]);
        test.displayCardDraw(remoteEvent);
        await acknowledgeCard();
        assert(!cardDialog.open, "Duplicate observer snapshots and direct display do not queue the same event twice");
        test.observeCardDraws([chainEvent, remoteEvent]);
        test.displayCardDraw(chainEvent);
        await wait(30);
        assert(!cardDialog.open && writes === observerWrites && storedPlayer.position === 33 && storedPlayer.balance === 1500 && storedGame.freeParkingPot === 720, "Observer/display and acknowledgement replay are read-only and never reshow baseline or acknowledged events");
        test.resetCardEvents();
        test.observeCardDraws([chainEvent], true);
        const pendingEvent = { ...remoteEvent, id: "metadata-ack-event" };
        test.observeCardDraws([chainEvent, pendingEvent], true);
        assert(!cardDialog.open, "Pending writes establish the baseline but do not show uncommitted draws");
        test.observeCardDraws([chainEvent, pendingEvent], false);
        assert(cardDialog.open && document.getElementById("boardCardPlayer").textContent.includes("Remote drawer"), "Metadata-only commit acknowledgement reveals draws received after the pending initial snapshot");
        await acknowledgeCard();
        test.observeCardDraws([chainEvent, pendingEvent], false);
        assert(!cardDialog.open, "Repeated metadata acknowledgement does not replay a card");
      } finally {
        test.board.animatePlayerMovement = realAnimate;
        test.board.drawChanceCard = holders => chanceDraw(holders, 7);
        test.board.drawCommunityChestCard = holders => communityDraw(holders, 1);
      }
      test.board.openBoardDialog();
      await wait(100);
      document.getElementById("boardPayMenu").open = true;
      await wait(30);
      const menuBounds = document.querySelector('#boardPayMenu .board-action-options').getBoundingClientRect();
      const dialogBounds = document.getElementById("boardDialog").getBoundingClientRect();
      assert(menuBounds.left >= dialogBounds.left && menuBounds.right <= dialogBounds.right, "Pay dropdown stays inside the board dialog even when action buttons wrap");
      document.getElementById("boardPayMenu").open = false;
      report.textContent = `PASS — ${results.length} checks\n\n${results.map(result => `✓ ${result}`).join("\n")}\n\nClose the board to read results. This page uses isolated test data only.`;
      document.title = `PASS: ${results.length} board checks`;
      window.boardTest = { test, state, results };
    } catch (error) {
      const report = document.getElementById("boardTestResults") || document.body.appendChild(document.createElement("pre"));
      report.textContent = `FAIL after ${results.length} checks\n${error.stack}\n\n${results.join("\n")}`;
      document.title = "FAIL: board checks";
      console.error(error);
    }
  </script>
